<!-- SHOWCASE -->
<section class="block showcase" id="showcase">
  <div class="container">
    <div class="showcase-head">
      <div>
        <div class="section-label reveal">01 - Showcase</div>
        <h2 class="section-title reveal">Case studies for <span class="gradient-text">code, apps, and UI/UX.</span></h2>
        <p class="showcase-copy reveal">A static portfolio system for GitHub Pages. Each card can hold a web build, mobile app, or design case without needing a database.</p>
        <div class="showcase-tabs reveal" role="tablist" aria-label="Showcase filters">
          <button class="showcase-tab active" type="button" data-filter="all">All</button>
          <button class="showcase-tab" type="button" data-filter="code">Code</button>
          <button class="showcase-tab" type="button" data-filter="mobile">Mobile App</button>
          <button class="showcase-tab" type="button" data-filter="uiux">UI/UX</button>
        </div>
      </div>
      <div class="floating-cases reveal" aria-hidden="true">
        <div class="floating-case">
          <div class="mock-browser-top"><span class="mock-dot"></span><span class="mock-dot"></span><span class="mock-dot"></span></div>
          <div class="mock-screen">
            <span class="mock-line short"></span>
            <span class="mock-line mid"></span>
            <div class="mock-grid"><span class="mock-tile"></span><span class="mock-tile"></span></div>
          </div>
        </div>
        <div class="floating-case mock-phone">
          <span class="mock-tile"></span>
          <span class="mock-line"></span>
          <span class="mock-line mid"></span>
          <span class="mock-line short"></span>
        </div>
        <div class="floating-case mock-figma">
          <div class="mock-screen">
            <span class="mock-line mid"></span>
            <div class="mock-grid"><span class="mock-tile"></span><span class="mock-tile"></span></div>
            <span class="mock-line"></span>
          </div>
        </div>
      </div>
    </div>
    <div class="showcase-grid" id="showcaseGrid"></div>
  </div>
</section>
