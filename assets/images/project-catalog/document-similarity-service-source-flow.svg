<text x="680" y="413" font-family="Arial, sans-serif" font-size="15" fill="#40575e" font-weight="normal"><tspan x="680" dy="0">Download PDF, extract text,</tspan><tspan x="680" dy="21.0">search candidate pages, compare</tspan><tspan x="680" dy="21.0">passages.</tspan></text>
