<text x="980" y="413" font-family="Arial, sans-serif" font-size="15" fill="#40575e" font-weight="normal"><tspan x="980" dy="0">Update job status, score, and</tspan><tspan x="980" dy="21.0">the JSON report in MySQL.</tspan></text>
