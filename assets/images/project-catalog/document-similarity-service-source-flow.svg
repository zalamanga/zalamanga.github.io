<text x="380" y="413" font-family="Arial, sans-serif" font-size="15" fill="#40575e" font-weight="normal"><tspan x="380" dy="0">Insert a job, return accepted</tspan><tspan x="380" dy="21.0">plus job_id, then run the</tspan><tspan x="380" dy="21.0">pipeline.</tspan></text>
