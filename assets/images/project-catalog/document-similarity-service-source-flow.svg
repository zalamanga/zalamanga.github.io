<text x="60" y="734" font-family="Arial, sans-serif" font-size="18" fill="#40575e" font-weight="normal"><tspan x="60" dy="0">A similarity score is not a plagiarism verdict. No external search, private PDF, or real database was used for</tspan><tspan x="60" dy="25.2">this diagram.</tspan></text>
