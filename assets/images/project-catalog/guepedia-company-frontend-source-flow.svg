<text x="60" y="734" font-family="Arial, sans-serif" font-size="18" fill="#40575e" font-weight="normal"><tspan x="60" dy="0">No company backend, manuscripts, account data, or credentials are included or accessed. This diagram does not</tspan><tspan x="60" dy="25.2">claim connected flows work.</tspan></text>
